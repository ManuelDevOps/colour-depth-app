<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#edf3fb">
    <title>Binary Pixel Colour Explorer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 3'%3E%3Cpath fill='red' d='M0 0h1v3H0z'/%3E%3Cpath fill='lime' d='M1 0h1v3H1z'/%3E%3Cpath fill='blue' d='M2 0h1v3H2z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./src/styles.css">
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <main class="explorer">
      <header class="page-header">
        <h1 data-i18n="title">Binary Pixel Colour Explorer</h1>
        <div class="header-actions">
          <button id="language-toggle" class="header-control" type="button" aria-label="Switch to Spanish">ES</button>
          <button id="help-open" class="header-control" type="button" aria-label="Help" aria-haspopup="dialog" aria-controls="help-dialog">?</button>
        </div>
      </header>

      <fieldset class="depth-selector">
        <legend data-i18n="depthTitle">Colour depth (bits per pixel)</legend>
        <div class="depth-options">
          <label class="depth-option"><input type="radio" name="depth" value="1" checked><span data-i18n="depth1">1 bit</span></label>
          <label class="depth-option"><input type="radio" name="depth" value="3"><span data-i18n="depth3">3 bits</span></label>
          <label class="depth-option"><input type="radio" name="depth" value="8"><span data-i18n="depth8">8 bits</span></label>
          <label class="depth-option"><input type="radio" name="depth" value="24"><span data-i18n="depth24">24 bits</span></label>
        </div>
      </fieldset>

      <div class="diagram" id="diagram">
        <svg id="wiring" class="wiring" aria-hidden="true" focusable="false"></svg>
        <section class="result" aria-labelledby="result-title">
          <h2 id="result-title" data-i18n="resultTitle">Resulting pixel</h2>
          <div id="pixel-swatch" class="pixel-swatch" role="img" aria-label="Resulting pixel: #000000"></div>
          <p id="colour-output" class="colour-output" role="status" aria-live="polite" aria-atomic="true">
            <span><span data-i18n="rgbLabel">RGB colour:</span> <strong id="rgb-value">rgb(0, 0, 0)</strong></span>
            <span><span data-i18n="hexLabel">Hexadecimal colour:</span> <strong id="hex-value">#000000</strong></span>
          </p>
        </section>

        <section class="channels" aria-labelledby="channels-title">
          <h2 id="channels-title" data-i18n="channelsTitle">RGB channels</h2>
          <div class="channel-values">
            <p class="channel channel-red"><span><span data-i18n="red">Red</span> (R)</span><span class="bulb" data-bulb="r" aria-hidden="true"><span class="bulb-glass"><span class="bulb-filament"></span></span><span class="bulb-base"></span></span><strong data-channel-value="r">0</strong></p>
            <p class="channel channel-green"><span><span data-i18n="green">Green</span> (G)</span><span class="bulb" data-bulb="g" aria-hidden="true"><span class="bulb-glass"><span class="bulb-filament"></span></span><span class="bulb-base"></span></span><strong data-channel-value="g">0</strong></p>
            <p class="channel channel-blue"><span><span data-i18n="blue">Blue</span> (B)</span><span class="bulb" data-bulb="b" aria-hidden="true"><span class="bulb-glass"><span class="bulb-filament"></span></span><span class="bulb-base"></span></span><strong data-channel-value="b">0</strong></p>
          </div>
        </section>

        <section class="bits-panel" aria-labelledby="bits-title">
          <h2 id="bits-title" class="sr-only" data-i18n="switchesTitle">Binary switches</h2>
          <div id="switch-groups" class="switch-groups"></div>
        </section>
      </div>
      <dialog id="help-dialog" aria-labelledby="help-title" aria-describedby="help-general">
        <h2 id="help-title" data-i18n="helpTitle">How the explorer works</h2>
        <p id="help-general" data-i18n="helpGeneral"></p>
        <h3 data-i18n="helpModeTitle">Current colour depth</h3>
        <p id="help-mode"></p>
        <button id="help-close" class="header-control" type="button" data-i18n="closeHelp">Close help</button>
      </dialog>
    </main>
  </body>
</html>
